<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="915" viewBox="0 0 1100 915"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000000" /></marker></defs><rect x="0" y="0" width="1100" height="915" fill="white" /><text x="40" y="35" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="40" dy="0">Macroflujo Proyectos de Gobierno</tspan></text><text x="40" y="65" fill="black" font-family="Arial" font-size="11pt" font-weight="normal"><tspan x="40" dy="0">Producto 2 A08. Versión 0.1 de revisión. Flujo funcional propuesto, no aprobación institucional.</tspan></text><rect x="120" y="105" width="860" height="62" rx="5" fill="#D6F0E7" stroke="#777777" /><text x="140" y="130" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">GOB01 Aprobar el proyecto de gobierno y su presupuesto</tspan></text><line x1="550" y1="167" x2="550" y2="197" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="200" width="860" height="62" rx="5" fill="#D8E8FB" stroke="#777777" /><text x="140" y="225" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">GOB02 Iniciar la adquisición y reservar presupuesto</tspan></text><line x1="550" y1="262" x2="550" y2="292" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="295" width="860" height="62" rx="5" fill="#FFEAC2" stroke="#777777" /><text x="140" y="320" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">GOB03 Solicitar comparar y seleccionar ofertas</tspan></text><line x1="550" y1="357" x2="550" y2="387" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="390" width="860" height="62" rx="5" fill="#EEE0F7" stroke="#777777" /><text x="140" y="415" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">GOB04 Contratar y registrar el compromiso</tspan></text><line x1="550" y1="452" x2="550" y2="482" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="485" width="860" height="62" rx="5" fill="#D6F0E7" stroke="#777777" /><text x="140" y="510" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">GOB05 Recibir verificar y reconocer la obligación</tspan></text><line x1="550" y1="547" x2="550" y2="577" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="580" width="860" height="62" rx="5" fill="#D8E8FB" stroke="#777777" /><text x="140" y="605" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">GOB06 Autorizar pagar y conciliar</tspan></text><line x1="550" y1="642" x2="550" y2="672" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="675" width="860" height="62" rx="5" fill="#FFEAC2" stroke="#777777" /><text x="140" y="700" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">GOB07 Formalizar donación y entrega institucional</tspan></text><line x1="550" y1="737" x2="550" y2="767" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="770" width="860" height="62" rx="5" fill="#EEE0F7" stroke="#777777" /><text x="140" y="795" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">GOB08 Cerrar el proyecto de gobierno</tspan></text><text x="40" y="899" fill="black" font-family="Arial" font-size="11pt" font-weight="normal"><tspan x="40" dy="0">Validar responsables, compuertas y excepciones con la ficha de cada proceso.</tspan></text></svg>