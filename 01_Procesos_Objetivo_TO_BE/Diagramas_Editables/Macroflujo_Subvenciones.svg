<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1485" viewBox="0 0 1100 1485"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000000" /></marker></defs><rect x="0" y="0" width="1100" height="1485" fill="white" /><text x="40" y="35" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="40" dy="0">Macroflujo Subvenciones</tspan></text><text x="40" y="65" fill="black" font-family="Arial" font-size="11pt" font-weight="normal"><tspan x="40" dy="0">Producto 2 A08. Versión 0.1 de revisión. Flujo funcional propuesto, no aprobación institucional.</tspan></text><rect x="120" y="105" width="860" height="62" rx="5" fill="#D6F0E7" stroke="#777777" /><text x="140" y="130" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB01 Preparar autorizar y publicar la convocatoria</tspan></text><line x1="550" y1="167" x2="550" y2="197" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="200" width="860" height="62" rx="5" fill="#D8E8FB" stroke="#777777" /><text x="140" y="225" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB02 Registrar la nota conceptual y crear el expediente</tspan></text><line x1="550" y1="262" x2="550" y2="292" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="295" width="860" height="62" rx="5" fill="#FFEAC2" stroke="#777777" /><text x="140" y="320" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB03 Verificar admisibilidad y gestionar subsanaciones</tspan></text><line x1="550" y1="357" x2="550" y2="387" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="390" width="860" height="62" rx="5" fill="#EEE0F7" stroke="#777777" /><text x="140" y="415" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB04 Evaluar y preseleccionar notas conceptuales</tspan></text><line x1="550" y1="452" x2="550" y2="482" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="485" width="860" height="62" rx="5" fill="#D6F0E7" stroke="#777777" /><text x="140" y="510" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB05 Recibir y acompañar la propuesta completa</tspan></text><line x1="550" y1="547" x2="550" y2="577" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="580" width="860" height="62" rx="5" fill="#D8E8FB" stroke="#777777" /><text x="140" y="605" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB06 Revisar calificar y recomendar la propuesta completa</tspan></text><line x1="550" y1="642" x2="550" y2="672" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="675" width="860" height="62" rx="5" fill="#FFEAC2" stroke="#777777" /><text x="140" y="700" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB07 Resolver la adjudicación y notificar</tspan></text><line x1="550" y1="737" x2="550" y2="767" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="770" width="860" height="62" rx="5" fill="#EEE0F7" stroke="#777777" /><text x="140" y="795" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB08 Formalizar contrato y línea base del proyecto</tspan></text><line x1="550" y1="832" x2="550" y2="862" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="865" width="860" height="62" rx="5" fill="#D6F0E7" stroke="#777777" /><text x="140" y="890" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB09 Tramitar el primer desembolso</tspan></text><line x1="550" y1="927" x2="550" y2="957" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="960" width="860" height="62" rx="5" fill="#D8E8FB" stroke="#777777" /><text x="140" y="985" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB10 Ejecutar y reportar avances y gastos</tspan></text><line x1="550" y1="1022" x2="550" y2="1052" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="1055" width="860" height="62" rx="5" fill="#FFEAC2" stroke="#777777" /><text x="140" y="1080" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB11 Revisar informes y controlar acciones correctivas</tspan></text><line x1="550" y1="1117" x2="550" y2="1147" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="1150" width="860" height="62" rx="5" fill="#EEE0F7" stroke="#777777" /><text x="140" y="1175" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB12 Tramitar desembolsos posteriores</tspan></text><line x1="550" y1="1212" x2="550" y2="1242" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="1245" width="860" height="62" rx="5" fill="#D6F0E7" stroke="#777777" /><text x="140" y="1270" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB13 Gestionar cambios e incumplimientos</tspan></text><line x1="550" y1="1307" x2="550" y2="1337" stroke="#000000" marker-end="url(#arrow)" /><rect x="120" y="1340" width="860" height="62" rx="5" fill="#D8E8FB" stroke="#777777" /><text x="140" y="1365" fill="black" font-family="Arial" font-size="11pt" font-weight="bold"><tspan x="140" dy="0">SUB14 Cerrar y consolidar resultados</tspan></text><text x="40" y="1469" fill="black" font-family="Arial" font-size="11pt" font-weight="normal"><tspan x="40" dy="0">Validar responsables, compuertas y excepciones con la ficha de cada proceso.</tspan></text></svg>